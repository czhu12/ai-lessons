# A plain container (not a VM) with an X11 toolbox: a virtual X server (Xvfb), a VNC server so you can watch it,
# simple X apps, and the automation tools the agent computer's computer server is built on (xdotool, xinput).
apiVersion: v1
kind: Pod
metadata: { name: x11-lab, namespace: lab }
spec:
  containers:
    - name: x11
      image: ubuntu:24.04
      command: [ bash, -c ]
      args:
        - |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            xvfb x11vnc xdotool xinput x11-apps x11-utils xterm imagemagick fonts-dejavu-core >/dev/null
          touch /ready
          sleep infinity
      resources: { requests: { memory: 256Mi }, limits: { memory: 1Gi } }
